
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lunéa Beauty</title>

    <link rel="stylesheet" href="styles.css">

    <!-- Tipografias -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display&display=swap" rel="stylesheet">

</head>

<body>

    <!-- ENCABEZADO -->

    <header class="header">

        <div class="logo">
            Lunéa Beauty
        </div>

        <nav class="menu">

            <a href="#">Inicio</a>

            <a href="#productos">Productos</a>

            <a href="#">Contacto</a>

            <!-- Icono de búsqueda -->

            <a href="#" class="icono" aria-label="Buscar">

                <svg viewBox="0 0 24 24">
                    <circle cx="10.5" cy="10.5" r="7.5"></circle>
                    <line x1="16" y1="16" x2="22" y2="22"></line>
                </svg>

            </a>

            <!-- Icono del carrito -->

            <a href="#" class="icono" aria-label="Carrito">

                <svg viewBox="0 0 24 24">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="19" cy="21" r="1"></circle>
                    <path d="M1 2h3l3.5 13h12L23 6H5"></path>
                </svg>

            </a>

        </nav>

    </header>


    <!-- TITULO PRINCIPAL -->

    <main>

        <section class="introduccion">

            <h1>Descubre nuestros productos</h1>

            <p>
                Encuentra tus favoritos para cuidar y resaltar tu belleza.
            </p>

        </section>


        <!-- PRODUCTOS -->

        <section class="productos" id="productos">


            <!-- PRODUCTO 1 -->

            <article class="producto">

                <img src="Images/Imagen1.jpeg" alt="Hyaluronic Serum">

                <h2>HYALURONIC SERUM</h2>

                <p class="precio">L. 450.00</p>

                <button>Agregar al carrito</button>

            </article>


            <!-- PRODUCTO 2 -->

            <article class="producto">

                <img src="Images/Imagen2.jpeg" alt="Niacinamide Dew Drops">

                <h2>NIACINAMIDE DEW DROPS</h2>

                <p class="precio">L. 380.00</p>

                <button>Agregar al carrito</button>

            </article>


            <!-- PRODUCTO 3 -->

            <article class="producto">

                <img src="Images/Imagen3.jpeg" alt="Pore-Tight Toner">

                <h2>PORE-TIGHT TONER</h2>

                <p class="precio">L. 550.00</p>

                <button>Agregar al carrito</button>

            </article>


        </section>

    </main>

</body>

</html>
